<div class="by4-banner-v067"><img src="assets/banner-v067.png" alt="بويوسف الصبر – صديقك في تايلند" loading="eager" decoding="async"></div><main class="by33-page"><div class="by33-head"><h1>🔐 تعيين كلمة المرور الجديدة</h1><p>أدخل كلمة مرور جديدة لحسابك</p></div><div class="by33-auth-wrap"><form id="change" class="by33-form" hidden><label>كلمة المرور الجديدة<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><label>تأكيد كلمة المرور<input type="password" name="confirm" minlength="8" autocomplete="new-password" required></label><button class="by33-primary" type="submit">حفظ كلمة المرور</button></form><p id="status" role="status">جارٍ فحص رابط الاستعادة...</p><a class="by33-home" href="login.html">العودة إلى تسجيل الدخول</a></div></main><script>const URL="https://nzukdiswtjrxitehkkak.supabase.co",KEY="sb_publishable_ZgUs-S8xlCKC62GQFZXpnQ_XwxRqwcO";const params=new URLSearchParams(location.hash.slice(1));const access=params.get('access_token');const type=params.get('type');const form=document.getElementById('change'),status=document.getElementById('status');history.replaceState(null,'',location.pathname);if(type==='recovery'&&access){form.hidden=false;status.textContent='أدخل كلمة المرور الجديدة.'}else{status.textContent='رابط الاستعادة غير صالح أو منتهي الصلاحية. اطلب رابطًا جديدًا من صفحة تسجيل الدخول.'}form.addEventListener('submit',async e=>{e.preventDefault();const pass=form.elements.password.value;if(pass!==form.elements.confirm.value){status.textContent='كلمتا المرور غير متطابقتين.';return}try{const response=await fetch(URL+'/auth/v1/user',{method:'PUT',headers:{'apikey':KEY,'Authorization':'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({password:pass})});if(!response.ok)throw Error('تعذر تغيير كلمة المرور. ربما انتهت صلاحية الرابط.');form.hidden=true;status.textContent='تم تغيير كلمة المرور. يمكنك تسجيل الدخول الآن.'}catch(e){status.textContent=e.message}});</script></body></html>
