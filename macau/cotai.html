<header class="top"><div class="wrap"><span class="brand">🇲🇴 بويوسف – دليلك إلى ماكاو</span></div></header><main class="wrap"><a class="back" href="index.html">← العودة للرئيسية</a><section class="hero"><h1>كوتاي</h1><p>71 مكانًا موزعة على الأقسام المختلفة</p></section><div class="search-panel"><input id="q" class="search" placeholder="ابحث داخل كوتاي فقط..."/><div class="filters" id="filters" aria-label="تصفية الأماكن حسب القسم"><span class="mc-filter-label">📂 الأقسام:</span><button class="active" data-cat="الكل">🗂️ الكل</button><button data-cat="المجمعات التجارية">🏬 المجمعات التجارية</button><button data-cat="المطاعم والكافيهات">🍽️ المطاعم والكافيهات</button><button data-cat="الفنادق">🏨 الفنادق</button><button data-cat="العروض والفعاليات">🎭 العروض والفعاليات</button><button data-cat="الإطلالات">🌅 الإطلالات</button><button data-cat="السياحة">🏛️ السياحة</button><button data-cat="المواصلات">🚌 المواصلات</button><button data-cat="المفضلة">❤️ المفضلة</button></div><p class="small" id="summary"></p><section class="items" id="results"></section><div style="text-align:center;margin:25px"><button id="more" class="region" type="button">عرض المزيد</button></div></div></main><footer class="wrap foot">بويوسف – دليل ماكاو V002 | قائمة بحثية، وليست سجلًا نهائيًا موثقًا لكل الفروع</footer><script src="data.js"></script><script>function esc(s){return String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}function card(p){let fav=localStorage.getItem('macau-fav-'+p.id)==='1';let loc=encodeURIComponent(p.name_en+' Macau');return `<article class="item"><h3>${esc(p.name_ar)}</h3><div class="en">${esc(p.name_en)}</div><div class="small">${esc(p.category)} | ${esc(p.area)}</div><p class="muted">${esc(p.notes)}</p><div class="actions"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${loc}">خرائط</a><button onclick="copyName(${p.id})">نسخ الاسم</button><button onclick="toggleFav(${p.id},this)">${fav?'♥ المفضلة':'♡ المفضلة'}</button></div></article>`}function copyName(id){let p=PLACES.find(x=>x.id===id);navigator.clipboard?.writeText(p.name_en)}function toggleFav(id,btn){let key='macau-fav-'+id;let v=localStorage.getItem(key)==='1';localStorage.setItem(key,v?'0':'1');btn.textContent=v?'♡ المفضلة':'♥ المفضلة'}const AREA="كوتاي";const q=document.getElementById('q'),res=document.getElementById('results'),sum=document.getElementById('summary'),more=document.getElementById('more');let cat='الكل',limit=18;function render(){let t=q.value.trim().toLocaleLowerCase();let rows=PLACES.filter(p=>p.area===AREA && (cat==='الكل'||p.category===cat||(cat==='المفضلة'&&localStorage.getItem('macau-fav-'+p.id)==='1')) && [p.name_ar,p.name_en,p.name_zh,p.category,p.notes].join(' ').toLocaleLowerCase().includes(t));res.innerHTML=rows.slice(0,limit).map(card).join('');sum.textContent=rows.length+' مكانًا مطابقًا';more.style.display=rows.length>limit?'inline-block':'none'}q.oninput=()=>{limit=18;render()};document.getElementById('filters').onclick=e=>{if(e.target.tagName!=='BUTTON')return;cat=e.target.dataset.cat;limit=18;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===e.target));render()};more.onclick=()=>{limit+=18;render()};render();</script><script defer src="../shared/guangzhou-unified-v046.js"></script></body></html>
